name: Email Digest Poll

# Owner directive 2026-09-19: the org-configurable digest schedule (see
# src/lib/email/schedule-service.ts, src/lib/email/digest.ts) needs to check
# every 15 minutes whether some org's morning/evening/custom slot is due,
# in THAT ORG's own local timezone -- Vercel Cron's Hobby tier is
# daily-granularity only, which can't drive that. Rather than assume a paid
# tier, this reuses the pattern claude-nightly-maintenance.yml already
# proves works in this repo: a real scheduled GitHub Actions workflow,
# free, with no Vercel plan dependency.
#
# This just calls the SAME endpoint (/api/internal/email-digest-cadence/run)
# the existing vercel.json daily cron already hits. That's deliberate, not
# an oversight: runDigestCadence()'s idempotency (a unique
# (schedule_id, local_date) claim in email_digest_run) makes it safe for
# both triggers to fire redundantly -- whichever gets there first wins, the
# other is a silent no-op. The old cron entry doesn't need to be removed.
#
# vars.PROJEXA_APP_URL: the deployed app's origin (e.g.
# https://projexa-ai.com) -- a repo VARIABLE, not a secret, same
# owner-editable-without-a-code-change posture as AI_L1_AGENT etc. in
# claude-nightly-maintenance.yml. secrets.EMAIL_DIGEST_CRON_SECRET must
# match the CRON_SECRET env var the deployed app itself reads (see
# src/app/api/internal/email-digest-cadence/run/route.ts's isAuthorized()).
# Until both are set, this workflow's step fails loudly (curl -f) rather
# than silently doing nothing -- see HANDOFF_DNS_POSTMARK_INBOUND.md for the
# full go-live checklist this is one item of.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger due digest sends
        env:
          APP_URL: ${{ vars.PROJEXA_APP_URL }}
          CRON_SECRET: ${{ secrets.EMAIL_DIGEST_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::PROJEXA_APP_URL (repo variable) and/or EMAIL_DIGEST_CRON_SECRET (repo secret) are not set -- see HANDOFF_DNS_POSTMARK_INBOUND.md."
            exit 1
          fi
          curl -sf -X POST "$APP_URL/api/internal/email-digest-cadence/run" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -o response.json
          cat response.json

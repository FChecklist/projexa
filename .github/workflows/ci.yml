name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
  migration-guard:
    # P2.1 (W-ENV, R81-ADDENDUM-B Part A / phase S5): the shared-database
    # model means a migration merged to main is applied to the SAME Supabase
    # project environment 2 will serve the moment it runs -- there is no
    # promotion step for schema (see R81-ADDENDUM-B Part A2). A destructive
    # migration (DROP TABLE/COLUMN, a narrowing ALTER COLUMN ... TYPE,
    # TRUNCATE) landing on main is therefore a production incident, not a
    # review comment. This job fails the build before that can happen.
    # Reviewed exceptions opt out per-file with an explicit
    # `-- MIGRATION-GUARD-OVERRIDE: reviewed by ... - <reason>` comment; see
    # scripts/check-migration-guard.mjs for the full rule and
    # scripts/__fixtures__/migration-guard for proof it fails on destructive
    # DDL and passes on additive/reviewed DDL.
    name: Migration guard (additive-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/check-migration-guard.mjs --self-test
      - run: bun scripts/check-migration-guard.mjs drizzle
  test:
    # Added during the R1-R64 recheck (2026-08-30): this repo had 220+ real
    # bun:test tests (route role-gates, offline sync, report math, static
    # regression guards like no-swallowed-http-errors.test.ts) that were
    # NEVER run in CI -- lint/typecheck/build were the only gates. That
    # means every one of those tests could silently regress on main with
    # nothing to catch it. `--isolate` (see bunfig.toml + CLAUDE.md's
    # Commands section) is required, not optional -- without it, 27+
    # test files that mock @/lib/supabase/auth-guard via mock.module()
    # without restoring it leak a stale mock across files in a single bun
    # test process, producing spurious role-gate failures that look exactly
    # like a live RBAC bug but are pure test order-dependence (confirmed via
    # direct reproduction; see CLAUDE.md).
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # R76 (2026-09-06, Vercel deploy lockdown, A3-03): fails the job
      # outright if the Layer 3 drift-guard test file is missing, independent
      # of whatever `bun test` below would or wouldn't catch on its own --
      # deleting a test silently drops its assertions rather than failing
      # anything. See platform.crr_ruling R76-RULING-01 (compliance-tracker
      # DB, project pcrjmlpuqsbocqfwoxod).
      - name: Guard against deleting the Vercel-lockdown drift test
        run: test -f src/lib/vercel-lockdown.test.ts || (echo "::error::src/lib/vercel-lockdown.test.ts is missing -- this is the Layer 3 drift guard for the Vercel deploy lockdown (R76-RULING-01). Restore it, do not just let this fail silently." && exit 1)
      - run: bun test --isolate
  build:
    name: Build
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run db:generate || true
      # Placeholder values mirror compliance-tracker's ci.yml build job:
      # src/lib/db/index.ts and src/lib/supabase/client.ts read these at
      # module scope / prerender time for some routes, so `next build`
      # needs *some* value present even though no real DB/Supabase project
      # is reachable from CI and no query actually runs.
      - run: bun run build
        env:
          DATABASE_URL: postgresql://postgres:placeholder@localhost:5432/postgres
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  perf:
    # R67 F-28 (audit recommendation R-249) -- the per-screen latency budget.
    #
    # WHAT IT DOES. Builds the app, starts it locally, and runs
    # scripts/perf-harness.mjs against http://localhost:3100 with the baseURL
    # overridden (playwright.config.ts's committed baseURL points at
    # https://projexa-ai.com, which this job must never measure). The harness
    # walks the 13 pages in perf/budgets.json, records TTFB / FCP / usable
    # ([data-state='ready'|'empty'], R67 F-31) / network-idle / API-call count
    # / slowest single call, probes the backend paths the audit could not price
    # separately, and exits non-zero naming any row outside its budget.
    #
    # WHY IT IS BEHIND A REPOSITORY VARIABLE. The harness measures the REAL
    # composed app: it logs in with a real seeded account and reads a real
    # project through VERIDIAN. That needs credentials this repo does not have
    # yet (PERF_EMAIL / PERF_PASSWORD / PERF_PROJECT_ID plus the Supabase and
    # VERIDIAN values the app boots with). A job that ran without them would
    # either fail every PR or -- worse -- pass while measuring a login page,
    # which is exactly the class of "harness that reports numbers it did not
    # measure" this item exists to remove. So it is switched off by a
    # repository VARIABLE (not a secret, so it can be read in `if`) and turns
    # into a real gate the moment the owner sets:
    #   Settings > Variables > PERF_HARNESS_ENABLED = true
    #   Settings > Secrets  > PERF_EMAIL, PERF_PASSWORD, PERF_PROJECT_ID,
    #                         PERF_SUPABASE_URL, PERF_SUPABASE_ANON_KEY,
    #                         PERF_DATABASE_URL
    # Until then the budget is still enforced where it can be honestly
    # enforced: src/lib/perf-budget.test.ts runs in the Test job above and
    # fails if the shipped figures are relaxed.
    name: Perf budget
    if: ${{ vars.PERF_HARNESS_ENABLED == 'true' }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Build
        run: bun run build
        env:
          DATABASE_URL: ${{ secrets.PERF_DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PERF_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PERF_SUPABASE_ANON_KEY }}
      - name: Start the app
        # nohup + disown, not a bare `&`: the server has to outlive THIS step,
        # and whether a backgrounded child survives its step's shell is runner
        # behaviour, not something this workflow states. `break`, not `exit 0`:
        # `exit` inside the loop would end the step's shell, which is how the
        # readiness check could "pass" without leaving anything running -- and
        # the next step then fails with a connection error that reads like a
        # perf regression.
        run: |
          nohup bun run start > /tmp/next.log 2>&1 &
          disown
          for i in $(seq 1 60); do
            curl -sf http://localhost:3100/login > /dev/null && break
            sleep 2
          done
          if ! curl -sf http://localhost:3100/login > /dev/null; then
            echo "the app never became reachable on :3100" >&2
            exit 1
          fi
        env:
          DATABASE_URL: ${{ secrets.PERF_DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PERF_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PERF_SUPABASE_ANON_KEY }}
      - name: Measure the 13 pages against perf/budgets.json
        run: bun scripts/perf-harness.mjs
        env:
          PERF_BASE_URL: http://localhost:3100
          PERF_EMAIL: ${{ secrets.PERF_EMAIL }}
          PERF_PASSWORD: ${{ secrets.PERF_PASSWORD }}
          PERF_PROJECT_ID: ${{ secrets.PERF_PROJECT_ID }}
      - name: Server log
        # A failed measurement is otherwise indistinguishable from a slow one:
        # this is where "the app crashed on boot" is legible.
        if: failure()
        run: cat /tmp/next.log
      - name: Keep the per-module table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: |
            perf/perf-results.json
            perf/perf-results.md

  e2e-env1:
    # PM/W-PROD R81 follow-up (2026-09-11): closes a real gap the `perf` job
    # above does not touch. Env 1 (this repo's own server on :3100 pointed at
    # a LOCAL compliance-tracker on :3000, per e2e/r81-d603-chain.spec.ts's
    # own header) is the environment R-80/R-81/R-82's real, 13/13-locally-
    # passing specs actually target -- but nothing in this file ever started
    # it, so those specs have never once run in CI. `perf` doesn't fix this:
    # it starts PROJEXA alone against production creds for a latency budget,
    # never a local compliance-tracker, and it isn't gated for a build-
    # environment reason PROJEXA controls -- it's gated because the owner has
    # not funded/enabled it yet.
    #
    # WHY THIS JOB ALSO STARTS OUT GATED, deliberately diverging from a plain
    # "run on every PR" ask: unlike `perf` (which reuses creds that already
    # exist), this job needs FOUR SECRETS THAT DO NOT YET EXIST IN THIS REPO
    # -- CT_DATABASE_URL / CT_SUPABASE_URL / CT_SUPABASE_ANON_KEY /
    # CT_SUPABASE_SERVICE_ROLE_KEY, compliance-tracker's own live Supabase
    # project (pcrjmlpuqsbocqfwoxod) creds, which this repo's secrets do not
    # currently hold under any name (confirmed: only PERF_* and
    # CLAUDE_CODE_OAUTH_TOKEN exist here today). Landing this unconditional
    # would either fail every PR (missing secrets) or -- once someone adds
    # them -- silently start running two real servers against the live
    # production database on every single PR with no owner decision in
    # between. `perf`'s own header already sets the precedent for exactly
    # this situation (a real capability gated behind a repository VARIABLE
    # until the owner deliberately turns it on): same shape, applied here.
    # Turn on with Settings > Variables > E2E_ENV1_ENABLED = true, once
    # Settings > Secrets has the four CT_* values above (copy them from
    # compliance-tracker's own already-live `DATABASE_URL` /
    # `NEXT_PUBLIC_SUPABASE_URL` / `NEXT_PUBLIC_SUPABASE_ANON_KEY` /
    # `SUPABASE_SERVICE_ROLE_KEY` secrets -- same project, this repo just has
    # no copy of them yet).
    #
    # SCOPE, DELIBERATELY NARROW: only e2e/r81-d603-chain.spec.ts, not the
    # whole e2e/ directory. That spec is documented READ-ONLY BY
    # CONSTRUCTION in its own header; the rest of e2e/ (Batch B/C) is not
    # audited for that property here and must not be swept in by accident
    # just because this job exists.
    name: E2E (Env 1)
    if: ${{ vars.E2E_ENV1_ENABLED == 'true' }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { path: projexa }
      # Public repo (FChecklist/compliance-tracker, made public 2026-08-29)
      # -- no token needed for a read-only checkout.
      - uses: actions/checkout@v7
        with: { repository: FChecklist/compliance-tracker, path: ct }
      - uses: oven-sh/setup-bun@v2
      - name: Install both apps
        run: |
          cd "$GITHUB_WORKSPACE/ct" && bun install --frozen-lockfile
          cd "$GITHUB_WORKSPACE/projexa" && bun install --frozen-lockfile
      - name: Start compliance-tracker on :3000
        # Same webServer command compliance-tracker's own playwright.config.ts
        # uses for its e2e job -- `next dev`, not a full production build,
        # for the same OOM-avoidance reason documented in that repo's
        # CLAUDE.md ("both build and typecheck OOM under Node's default
        # heap on an 8GB machine" -- this runner is bigger, but there is no
        # reason to pay a ~2m23s build here when dev-mode boot is what the
        # spec's own header was written and verified against).
        run: |
          cd "$GITHUB_WORKSPACE/ct"
          nohup bash -c "node scripts/generate-protected-routes.mjs && npx next dev -p 3000" > /tmp/ct.log 2>&1 &
          disown
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health > /dev/null 2>&1 && break
            sleep 5
          done
        env:
          DATABASE_URL: ${{ secrets.CT_DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CT_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.CT_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CT_SUPABASE_SERVICE_ROLE_KEY }}
      - name: Start PROJEXA on :3100 (pointed at the local compliance-tracker)
        run: |
          cd "$GITHUB_WORKSPACE/projexa"
          nohup bash -c "npx next dev -p 3100" > /tmp/projexa.log 2>&1 &
          disown
          for i in $(seq 1 60); do
            curl -sf http://localhost:3100/login > /dev/null 2>&1 && break
            sleep 5
          done
          if ! curl -sf http://localhost:3100/login > /dev/null 2>&1; then
            echo "PROJEXA never became reachable on :3100" >&2
            exit 1
          fi
        env:
          # This is the one line that actually turns "Env 1" on: without it
          # veridian-client.ts falls back to the paused production Vercel URL.
          VERIDIAN_API_BASE_URL: http://localhost:3000/api/v1/projexa
          DATABASE_URL: ${{ secrets.PERF_DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PERF_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PERF_SUPABASE_ANON_KEY }}
      - run: cd "$GITHUB_WORKSPACE/projexa" && bunx playwright install --with-deps chromium
      - name: Run the Env-1 spec
        run: cd "$GITHUB_WORKSPACE/projexa" && bunx playwright test e2e/r81-d603-chain.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3100
      - name: Server logs
        if: failure()
        run: |
          echo "--- compliance-tracker (:3000) ---"; cat /tmp/ct.log || true
          echo "--- PROJEXA (:3100) ---"; cat /tmp/projexa.log || true
      - name: Keep the trace/report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-env1-report
          path: projexa/playwright-report/
          if-no-files-found: ignore

  secret-scan:
    # R60 T9: replaces GitHub's own secret scanning/push protection, which
    # was auto-disabled when this repo went private (GitHub Free has
    # neither for private repos, GHAS is paid and declined). Deliberately
    # a real, blocking check -- no continue-on-error -- proven against a
    # planted fake secret on a throwaway branch (never merged; run
    # 33138756098/job 98744618501, conclusion failure, caught github-pat +
    # stripe-access-token) before landing this as the permanent gate.
    # permissions block required: gitleaks-action's PR-scan mode calls the
    # GitHub API to diff the PR and failed with "Resource not accessible
    # by integration" using this repo's default (more restrictive) token
    # scope, even though the identical action config worked unmodified on
    # compliance-tracker -- the two repos evidently have different
    # Settings > Actions > default workflow permissions.
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

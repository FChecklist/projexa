name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
  test:
    # Added during the R1-R64 recheck (2026-08-30): this repo had 220+ real
    # bun:test tests (route role-gates, offline sync, report math, static
    # regression guards like no-swallowed-http-errors.test.ts) that were
    # NEVER run in CI -- lint/typecheck/build were the only gates. That
    # means every one of those tests could silently regress on main with
    # nothing to catch it. `--isolate` (see bunfig.toml + CLAUDE.md's
    # Commands section) is required, not optional -- without it, 27+
    # test files that mock @/lib/supabase/auth-guard via mock.module()
    # without restoring it leak a stale mock across files in a single bun
    # test process, producing spurious role-gate failures that look exactly
    # like a live RBAC bug but are pure test order-dependence (confirmed via
    # direct reproduction; see CLAUDE.md).
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test --isolate
  build:
    name: Build
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run db:generate || true
      # Placeholder values mirror compliance-tracker's ci.yml build job:
      # src/lib/db/index.ts and src/lib/supabase/client.ts read these at
      # module scope / prerender time for some routes, so `next build`
      # needs *some* value present even though no real DB/Supabase project
      # is reachable from CI and no query actually runs.
      - run: bun run build
        env:
          DATABASE_URL: postgresql://postgres:placeholder@localhost:5432/postgres
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  perf:
    # R67 F-28 (audit recommendation R-249) -- the per-screen latency budget.
    #
    # WHAT IT DOES. Builds the app, starts it locally, and runs
    # scripts/perf-harness.mjs against http://localhost:3100 with the baseURL
    # overridden (playwright.config.ts's committed baseURL points at
    # https://projexa-ai.com, which this job must never measure). The harness
    # walks the 13 pages in perf/budgets.json, records TTFB / FCP / usable
    # ([data-state='ready'|'empty'], R67 F-31) / network-idle / API-call count
    # / slowest single call, probes the backend paths the audit could not price
    # separately, and exits non-zero naming any row outside its budget.
    #
    # WHY IT IS BEHIND A REPOSITORY VARIABLE. The harness measures the REAL
    # composed app: it logs in with a real seeded account and reads a real
    # project through VERIDIAN. That needs credentials this repo does not have
    # yet (PERF_EMAIL / PERF_PASSWORD / PERF_PROJECT_ID plus the Supabase and
    # VERIDIAN values the app boots with). A job that ran without them would
    # either fail every PR or -- worse -- pass while measuring a login page,
    # which is exactly the class of "harness that reports numbers it did not
    # measure" this item exists to remove. So it is switched off by a
    # repository VARIABLE (not a secret, so it can be read in `if`) and turns
    # into a real gate the moment the owner sets:
    #   Settings > Variables > PERF_HARNESS_ENABLED = true
    #   Settings > Secrets  > PERF_EMAIL, PERF_PASSWORD, PERF_PROJECT_ID,
    #                         PERF_SUPABASE_URL, PERF_SUPABASE_ANON_KEY,
    #                         PERF_DATABASE_URL
    # Until then the budget is still enforced where it can be honestly
    # enforced: src/lib/perf-budget.test.ts runs in the Test job above and
    # fails if the shipped figures are relaxed.
    name: Perf budget
    if: ${{ vars.PERF_HARNESS_ENABLED == 'true' }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Build
        run: bun run build
        env:
          DATABASE_URL: ${{ secrets.PERF_DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PERF_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PERF_SUPABASE_ANON_KEY }}
      - name: Start the app
        run: |
          bun run start &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3100/login > /dev/null && exit 0
            sleep 2
          done
          echo "the app never became reachable on :3100" >&2
          exit 1
        env:
          DATABASE_URL: ${{ secrets.PERF_DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PERF_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PERF_SUPABASE_ANON_KEY }}
      - name: Measure the 13 pages against perf/budgets.json
        run: bun scripts/perf-harness.mjs
        env:
          PERF_BASE_URL: http://localhost:3100
          PERF_EMAIL: ${{ secrets.PERF_EMAIL }}
          PERF_PASSWORD: ${{ secrets.PERF_PASSWORD }}
          PERF_PROJECT_ID: ${{ secrets.PERF_PROJECT_ID }}
      - name: Keep the per-module table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: |
            perf/perf-results.json
            perf/perf-results.md

  secret-scan:
    # R60 T9: replaces GitHub's own secret scanning/push protection, which
    # was auto-disabled when this repo went private (GitHub Free has
    # neither for private repos, GHAS is paid and declined). Deliberately
    # a real, blocking check -- no continue-on-error -- proven against a
    # planted fake secret on a throwaway branch (never merged; run
    # 33138756098/job 98744618501, conclusion failure, caught github-pat +
    # stripe-access-token) before landing this as the permanent gate.
    # permissions block required: gitleaks-action's PR-scan mode calls the
    # GitHub API to diff the PR and failed with "Resource not accessible
    # by integration" using this repo's default (more restrictive) token
    # scope, even though the identical action config worked unmodified on
    # compliance-tracker -- the two repos evidently have different
    # Settings > Actions > default workflow permissions.
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

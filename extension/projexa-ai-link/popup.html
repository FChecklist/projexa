<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 340px; margin: 0; padding: 14px; font: 13px system-ui, sans-serif; color: #1c2b3a; background: #fffdf9; }
    h1 { font-size: 15px; margin: 0 0 6px; }
    p { margin: 0 0 8px; color: #55657a; }
    textarea { width: 100%; height: 80px; box-sizing: border-box; font: 12px ui-monospace, monospace; }
    button { margin-top: 8px; padding: 7px 12px; border: 0; border-radius: 6px; background: #f5820a; color: #1c2b3a; font-weight: 600; cursor: pointer; }
    #msg { margin-left: 8px; color: #0e7c6e; }
  </style>
</head>
<body>
  <h1>PROJEXA AI Link</h1>
  <p>In PROJEXA click <b>AI prompt</b>, then paste it (or just your link) here once. On ChatGPT, Claude, Gemini, DeepSeek or z.ai, the orange PROJEXA button fetches your guide and puts a small prompt plus the guide in the chat box.</p>
  <textarea id="t" placeholder="Paste your PROJEXA link or prompt here"></textarea>
  <div><button id="save">Save</button><button id="paste">Paste from clipboard</button><span id="msg"></span></div>
  <script src="lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
